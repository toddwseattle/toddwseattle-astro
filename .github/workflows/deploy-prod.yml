name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "deploy-production" to confirm production deployment'
        required: true
        default: ""

jobs:
  deploy-prod:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write

    steps:
      - name: Confirm deployment intent
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "deploy-production" ]; then
            echo "❌ Production deployment confirmation mismatch."
            echo "Please re-run the workflow and enter 'deploy-production' exactly in the confirmation field."
            exit 1
          fi
          echo "✅ Production deployment confirmed"

      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (critical)
        run: npm audit --audit-level=critical

      - name: Build site
        env:
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID_PRODUCTION }}
        run: npm run build

      - name: Deploy to Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          target: prod
          projectId: toddwseattle-astro
