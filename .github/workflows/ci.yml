name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Type Check & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high)
        run: npm audit --audit-level=high

      - name: Type check
        run: npx astro check

      - name: Run tests
        run: npm run test:run
